[project]
name = "automated-posting"
version = "1.0.0"
description = "FastAPI service that publishes a message to multiple third-party platforms."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters such as "…" and "–"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]  # dummy credentials in tests
"app/platforms/*" = ["S101"]  # asserts document invariants guaranteed by the registry

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_generics = false
